<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="../Styles/perfil.css">
</head>
<body>

<div class="perfil-container">
    <h1>Perfil</h1>

    <div class="perfil-info">

</script>

</body>
</html>
